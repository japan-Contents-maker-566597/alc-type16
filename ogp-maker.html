<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>OGPメーカー（最終版）</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* OGPの黄金比サイズ (1200x630) */
        .ogp-container {
            width: 1200px;
            height: 630px;
            position: relative;
            background-color: #f0f4ff;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }

        /* 背景の16タイプ画像 */
        .bg-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }
        
        .bg-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            mix-blend-mode: multiply;
        }

        /* 中央のタイトルエリア */
        .center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.8);
            padding: 30px 60px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            border: 6px solid #6a1b9a;
            z-index: 10;
            backdrop-filter: blur(2px);
        }

        .title {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 90px;
            color: #6a1b9a;
            margin: 0;
            line-height: 1.1;
            white-space: nowrap;
            text-shadow: 
                5px 5px 0 #fff, -5px -5px 0 #fff,
                -5px 5px 0 #fff, 5px -5px 0 #fff,
                5px 0 0 #fff, -5px 0 0 #fff,
                0 5px 0 #fff, 0 -5px 0 #fff,
                0 4px 10px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 38px; /* 文字サイズ調整 */
            color: #4a148c;
            margin-top: 20px;
            font-weight: 800;
            line-height: 1.5; /* 行間を広げて読みやすく */
        }

        /* 右下のCTAボタン */
        .cta-button {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 170px; /* 少し大きく */
            height: 170px;
            /* ▼修正: 背景を少し透過 (0.85) */
            background-color: rgba(211, 47, 47, 0.85); 
            border: 6px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 20;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transform: rotate(-10deg);
        }

        .cta-text {
            color: #fff;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 32px;
            font-weight: 800;
            line-height: 1.3;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        /* 指アイコン (SVGで描画) */
        .hand-icon {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 90px;
            height: 90px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transform: rotate(-15deg);
        }
    </style>
</head>
<body>

    <div class="ogp-container">
        
        <div class="bg-grid">
            <img src="酒タイプ画像/LOUT.jpg" class="bg-item">
            <img src="酒タイプ画像/LOUY.jpg" class="bg-item">
            <img src="酒タイプ画像/LODT.jpg" class="bg-item">
            <img src="酒タイプ画像/LODY.jpg" class="bg-item">
            <img src="酒タイプ画像/LRUT.jpg" class="bg-item">
            <img src="酒タイプ画像/LRUY.jpg" class="bg-item">
            <img src="酒タイプ画像/LRDT.jpg" class="bg-item">
            <img src="酒タイプ画像/LRDY.jpg" class="bg-item">
            <img src="酒タイプ画像/FOUT.jpg" class="bg-item">
            <img src="酒タイプ画像/FOUY.jpg" class="bg-item">
            <img src="酒タイプ画像/FODT.jpg" class="bg-item">
            <img src="酒タイプ画像/FODY.jpg" class="bg-item">
            <img src="酒タイプ画像/FRUT.jpg" class="bg-item">
            <img src="酒タイプ画像/FRUY.jpg" class="bg-item">
            <img src="酒タイプ画像/FRDT.jpg" class="bg-item">
            <img src="酒タイプ画像/FRDY.jpg" class="bg-item">
        </div>

        <div class="center-box">
            <h1 class="title">酒タイプ診断</h1>
            <div class="subtitle">
                お酒を飲んだあなたの本当の姿を<br>
                全16タイプから診断します！
            </div>
        </div>

        <div class="cta-button">
            <div class="cta-text">診断を<br>始める</div>
            
            <svg class="hand-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.5 55L45 10C45 10 52 8 55 20C57 28 48 45 48 45L60 45C65 45 68 48 68 52C68 54 67 56 65 58L68 58C72 58 75 61 75 65C75 67 74 69 72 70L75 70C79 70 82 73 82 77C82 79 81 81 79 82L80 82C84 82 87 85 87 89C87 95 82 100 75 100H45C30 100 20 90 15 80L5 65L22.5 55Z" fill="white" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
            </svg>
        </div>

    </div>

</body>
</html>
