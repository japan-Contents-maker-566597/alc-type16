<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>OGPメーカー（修正版）</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* OGPの黄金比サイズ (1200x630) */
        .ogp-container {
            width: 1200px;
            height: 630px;
            position: relative;
            background-color: #f0f4ff;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }

        /* 背景の16タイプ画像 */
        .bg-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }
        
        .bg-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7; /* 背景も少しだけ濃くしました */
            mix-blend-mode: multiply;
        }

        /* 中央のタイトルエリア */
        .center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* ▼修正: 透過度を強めて(0.95→0.8)後ろが見えるように */
            background: rgba(255, 255, 255, 0.8);
            padding: 30px 60px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            /* ▼修正: 枠線をサイトの紫カラーに変更 */
            border: 6px solid #6a1b9a;
            z-index: 10;
            /* 背景をぼかして文字を見やすくする（すりガラス効果） */
            backdrop-filter: blur(2px);
        }

        .title {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 90px;
            /* ▼修正: 文字色をサイトの紫カラーに変更 */
            color: #6a1b9a;
            margin: 0;
            line-height: 1.1;
            white-space: nowrap;
            /* 白フチを強くして、背景が透けても読めるように */
            text-shadow: 
                5px 5px 0 #fff, -5px -5px 0 #fff,
                -5px 5px 0 #fff, 5px -5px 0 #fff,
                5px 0 0 #fff, -5px 0 0 #fff,
                0 5px 0 #fff, 0 -5px 0 #fff,
                0 4px 10px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 36px;
            /* サブタイトルは少し濃い目のグレーか紫系で引き締め */
            color: #4a148c;
            margin-top: 20px;
            font-weight: 800;
            line-height: 1.4;
        }
        
        .subtitle-sub {
            display: block;
            margin-top: 5px;
            font-size: 1.1em;
            color: #d32f2f; /* ここだけ赤でアクセント */
        }

        /* ▼追加: 右下のCTAボタン */
        .cta-button {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 160px;
            height: 160px;
            background-color: #d32f2f; /* 目立つ赤色 */
            border: 6px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 20;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transform: rotate(-10deg); /* 動きをつける */
        }

        .cta-text {
            color: #fff;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 34px;
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="ogp-container">
        
        <div class="bg-grid">
            <img src="酒タイプ画像/LOUT.jpg" class="bg-item">
            <img src="酒タイプ画像/LOUY.jpg" class="bg-item">
            <img src="酒タイプ画像/LODT.jpg" class="bg-item">
            <img src="酒タイプ画像/LODY.jpg" class="bg-item">
            <img src="酒タイプ画像/LRUT.jpg" class="bg-item">
            <img src="酒タイプ画像/LRUY.jpg" class="bg-item">
            <img src="酒タイプ画像/LRDT.jpg" class="bg-item">
            <img src="酒タイプ画像/LRDY.jpg" class="bg-item">
            <img src="酒タイプ画像/FOUT.jpg" class="bg-item">
            <img src="酒タイプ画像/FOUY.jpg" class="bg-item">
            <img src="酒タイプ画像/FODT.jpg" class="bg-item">
            <img src="酒タイプ画像/FODY.jpg" class="bg-item">
            <img src="酒タイプ画像/FRUT.jpg" class="bg-item">
            <img src="酒タイプ画像/FRUY.jpg" class="bg-item">
            <img src="酒タイプ画像/FRDT.jpg" class="bg-item">
            <img src="酒タイプ画像/FRDY.jpg" class="bg-item">
        </div>

        <div class="center-box">
            <h1 class="title">酒タイプ診断</h1>
            <div class="subtitle">
                お酒を飲んだあなたの<br>本当の姿は？<br>
                <span class="subtitle-sub">🍶全16タイプ🍻</span>
            </div>
        </div>

        <div class="cta-button">
            <div class="cta-text">今すぐ<br>診断！</div>
        </div>

    </div>

</body>
</html>
