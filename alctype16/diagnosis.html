<body>

    <!-- Global Header -->
    <nav class="global-header">
        <a href="./index.html" class="header-logo">
            <span style="font-size:1.4rem;">🍺</span><span class="text-logo">酒タイプ診断</span>
        </a>
        <div class="header-nav">
            <a href="./diagnosis.html">診断を受ける</a>
            <a href="./list.html">16タイプ一覧</a>
            <a href="./supplement/index.html">特集記事</a>
            <a href="./en/index.html">English</a>
        </div>
        <button class="menu-toggle" aria-label="Menu" onclick="document.getElementById('mobileMenu').classList.toggle('active')">☰</button>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
        <a href="./diagnosis.html">診断を受ける</a>
        <a href="./list.html">16タイプ一覧</a>
        <a href="./supplement/index.html">特集記事</a>
        <a href="./en/index.html">English</a>
    </div>

    <div class="lang-toggle"><a href="./en/diagnosis.html">🌐 English</a></div>
    
    <header class="hero-section" style="padding-bottom: 30px;">
        <div class="container fade-in">
            <h1 class="hero-logo" style="font-size: clamp(1.5rem, 5vw, 2.2rem); word-break: keep-all;">あなたのことを教えてください</h1>
            <p class="hero-subtitle mb-2">直感で、自分の飲酒スタイルに最も近いものを選んでください。</p>
        </div>
    </header>

    <!-- Sticky Progress Bar -->
    <div class="progress-container fade-in">
        <div class="container" style="padding: 0; max-width: 600px;">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 16 回答完了</div>
        </div>
    </div>

    <div class="container fade-in" style="max-width: 600px; padding-top: 10px;">
        <form id="diagnosisForm">
            <div class="glass-card mb-8">
                <p class="text-center mb-4" style="font-weight: 800; color: var(--brand-purple);">基本情報 (オプション)</p>
                <div class="mb-4">
                    <input type="text" id="userName" class="name-input" placeholder="ニックネームを入力 (後から変更可能)">
                </div>
                <div>
                    <span class="select-input-label text-center">性別</span>
                    <select id="userGender" class="select-input">
                        <option value="回答しない" selected>回答しない</option>
                        <option value="男性">男性</option>
                        <option value="女性">女性</option>
                    </select>
                </div>
            </div>

            <!-- Ad Spot -->
            <div class="text-center mb-8 fade-in" style="min-height: 250px;">
                <!-- admax -->
                <script src="https://adm.shinobi.jp/s/1f943b2f77393147a7da8f634acb2c30"></script>
                <!-- admax -->
            </div>

            <div id="questionsContainer"></div>
            
            <button type="submit" class="btn btn-primary" id="submitBtn" style="padding: 20px; font-size: 1.2rem; margin-top: 20px;">診断結果を見る✨</button>
            <p class="consent-note">
                ※ご入力いただいた情報は診断および分析にのみ利用されます。<br>
                <a href="policy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意の上ご利用ください。
            </p>
        </form>

        <div style="margin-top: 40px; text-align: center;">
            <a href="./index.html" class="btn btn-secondary">TOPページに戻る</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGq72C-ukIViED8rTiRYx7jMrp4PXapxOdBn5h6aU1OGbis4X5tBJvqM6rzDRerfE/exec";
        const questions = [
            { id: 1, axis: "LF", text: "飲み会のお店の選定は？", a: "A: 自分の行きたい店を提案する。", b: "B: 皆の意見を聞いてから決める。" },
            { id: 2, axis: "LF", text: "場の雰囲気が微妙になったら？", a: "A: 自分が話題を提供し、流れを変える。", b: "B: 誰かの行動を待ち、流れに任せる。" },
            { id: 3, axis: "LF", text: "飲み会での役割は？", a: "A: 幹事や盛り上げ役など、中心にいたい。", b: "B: 聴き役やサポート役など、裏方でいたい。" },
            { id: 4, axis: "LF", text: "乾杯の音頭は？", a: "A: 進んで自分が取り、場を仕切りたい。", b: "B: 他の誰かに譲る方が楽だ。" },
            { id: 5, axis: "OR", text: "飲み会前に翌日の予定を？", a: "A: 気にせず、その場のノリを優先する。", b: "B: 終電時間や翌朝に響かないかチェックする。" },
            { id: 6, axis: "OR", text: "飲酒時の財布のひもは？", a: "A: 大胆になり、奢ったり多めに払いがち。", b: "B: 冷静に予算を管理し、きっちり割る。" },
            { id: 7, axis: "OR", text: "飲み会後の後片付けは？", a: "A: 誰かがやるだろうと気にしない。", b: "B: 散らかった場所を率先して片付ける。" },
            { id: 8, axis: "OR", text: "飲み会の企画は？", a: "A: 面白さ最優先。面白ければなんでもいい。", b: "B: バランス重視。楽しみつつちゃんとしたい。" },
            { id: 9, axis: "UD", text: "酔い始めの行動は？", a: "A: 陽気になり、声が大きくなる。", b: "B: 物静かになり、思考が深くなる。" },
            { id: 10, axis: "UD", text: "酔ったときの感情は？", a: "A: 普段よりもハイになり、無敵感がある。", b: "B: 普段よりも感傷的になり、センチメンタル。" },
            { id: 11, axis: "UD", text: "飲み会でのSNS使用は？", a: "A: 楽しんでいる様子はどんどんみんなにシェアしたい。", b: "B: 飲み会の様子はSNSには載せたくない。" },
            { id: 12, axis: "UD", text: "酔ったときの身体の動きは？", a: "A: 声やリアクションが大きくなる、笑いのツボが浅くなる。", b: "B: 静かになる、眠くなる、テンションが下がる。" },
            { id: 13, axis: "TY", text: "飲むペースは？", a: "A: 周りがどうであろうと、自分のハイペースを維持。", b: "B: 周りのペースに合わせるか、それより遅い。" },
            { id: 14, axis: "TY", text: "飲めるお酒の量は？", a: "A: 何杯飲んでも、ほぼ酔ったように見えない。", b: "B: すぐに酔いが回り、セーブが必要になる。" },
            { id: 15, axis: "TY", text: "コールや一気飲みの強要は？", a: "A: 余裕で受け入れ、むしろ楽しむ。", b: "B: 可能な限り拒否して、自分のペースを守る。" },
            { id: 16, axis: "TY", text: "翌日の記憶は？", a: "A: 泥酔しても断片的に覚えていることが多い。", b: "B: 少し飲みすぎると、記憶がほぼ飛ぶ。" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const diagnosisForm = document.getElementById('diagnosisForm');
            const questionsContainer = document.getElementById('questionsContainer');
            const userNameInput = document.getElementById('userName');
            const genderSelect = document.getElementById('userGender');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            function renderQuestions() {
                const rubies = ['A寄り', 'ややA', '中間', 'ややB', 'B寄り'];
                questionsContainer.innerHTML = questions.map((q, index) => `
                    <div class="question-card" data-question-id="${q.id}">
                        <div class="q-num">Q${index + 1} / 16</div>
                        <p class="question-text">${q.text}</p>
                        <div class="question-choice question-choice-a">${q.a}</div>
                        <div class="options-container">
                        ${[1, 2, 3, 4, 5].map((val, i) => `
                            <label class="option-label">
                                <input type="radio" name="q${q.id}" value="${val}" required>
                                <span>${rubies[i]}</span>
                            </label>
                        `).join('')}
                        </div>
                        <div class="question-choice question-choice-b">${q.b}</div>
                    </div>
                `).join('');
            }

            function updateProgress() {
                const total = questions.length;
                let answered = 0;
                questions.forEach(q => {
                    if (diagnosisForm.querySelector(`input[name="q${q.id}"]:checked`)) answered++;
                });
                const percentage = (answered / total) * 100;
                progressBar.style.width = percentage + '%';
                progressText.textContent = `${answered} / ${total} 回答完了`;
                
                if (answered === total) {
                    progressBar.style.background = 'linear-gradient(90deg, #4ade80, #16a34a)';
                    progressText.style.color = '#16a34a';
                    progressText.textContent = '全問回答完了！結果を見ましょう✨';
                }
            }

            questionsContainer.addEventListener('change', e => {
                if (e.target.type === 'radio') {
                    const questionCard = e.target.closest('.question-card');
                    questionCard.querySelectorAll('.option-label').forEach(label => {
                        label.classList.remove('selected');
                    });
                    e.target.parentElement.classList.add('selected');
                    updateProgress();
                    
                    // Auto-scroll to next un-answered question
                    const nextCard = questionCard.nextElementSibling;
                    if(nextCard && nextCard.classList.contains('question-card')) {
                        const isAnswered = nextCard.querySelector('input[type="radio"]:checked');
                        if(!isAnswered) {
                            setTimeout(() => {
                                const y = nextCard.getBoundingClientRect().top + window.scrollY - 100;
                                window.scrollTo({top: y, behavior: 'smooth'});
                            }, 300);
                        }
                    }
                }
            });

            diagnosisForm.addEventListener('submit', async e => {
                e.preventDefault();
                const formData = new FormData(diagnosisForm);
                if (Array.from(formData.keys()).length < questions.length) {
                    alert('すべての質問に回答してください。');
                    return;
                }
                const axisScores = { LF: 0, OR: 0, UD: 0, TY: 0 };
                questions.forEach(q => {
                    axisScores[q.axis] += parseInt(formData.get(`q${q.id}`), 10);
                });
                let resultType = '';
                resultType += (axisScores.LF / 4) < 3.0 ? 'L' : 'F';
                resultType += (axisScores.OR / 4) < 3.0 ? 'O' : 'R';
                resultType += (axisScores.UD / 4) < 3.0 ? 'U' : 'D';
                resultType += (axisScores.TY / 4) < 3.0 ? 'T' : 'Y';
                const resultCode = resultType.toLowerCase();

                const nicknameRaw = userNameInput.value.trim();
                const nickname = nicknameRaw || 'ゲスト';
                const gender = genderSelect ? genderSelect.value : '回答しない';
                const payload = {
                    name: nickname,
                    gender,
                    result: resultCode,
                    device: navigator.userAgent || ''
                };

                // Visual loading state
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.innerHTML = '🎯 診断中...';
                submitBtn.style.opacity = '0.7';

                try {
                    if (SCRIPT_URL && SCRIPT_URL.startsWith('http')) {
                        const sendPromise = fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        }).catch(() => {});

                        await Promise.race([
                            sendPromise,
                            new Promise(resolve => setTimeout(resolve, 800))
                        ]);
                    }
                } catch (err) {
                    console.error('send error', err);
                }

                window.location.href = './types/' + resultCode + '.html';
            });

            renderQuestions();
        });
    </script>
</body>
</html>
