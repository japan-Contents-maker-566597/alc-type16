  <script>
    const typeData = {
      LOUT: { name: "アル中番長", catch: "「お酒が強くて、ノリも最高！」場の主導権を握り、みんなを盛り上げる。最強の肉体を持つタフネスリーダー。" },
      LOUY: { name: "ハイテンション時限爆弾", catch: "「ノリは最高だが、体はガラス…」主導権を握って場を盛り上げるが、限界を超えると一瞬で爆発する陽キャの弱体化版。" },
      LODT: { name: "飲み参謀", catch: "「酔っても冷静、全て計算通り」お酒は強いけど騒がない。場を仕切りつつ、ダウナーで人間観察を楽しむ影の総帥。" },
      LODY: { name: "爆発インキャ", catch: "「酔うと愚痴が止まらない」 場を主導権を握るが、お酒が弱いので静かに愚痴を吐き続け、周りを重くする内向的なボス。" },
      LRUT: { name: "自称プロ幹事", catch: "「完璧な飲み会設計」 自ら飲み会を企画しつつ、テンション高く場を回す。お祭り好きなプロの盛り上げ屋。" },
      LRUY: { name: "ちゃんとした人", catch: "「酔う前にすべて出し切る」終電を見据え、短時間で全力投球する効率重視の陽キャ。飲み会に迷い込んだ一般人。" },
      LRDT: { name: "朝までうんちく先輩", catch: "「情熱と理性を失わない」強い酒を飲みながら、仕事や人生について静かに深く語り続ける。うんちくが止まらない。" },
      LRDY: { name: "水泥棒", catch: "「お酒は弱いが、しっかり反省」面倒な酔い方をするが、翌日には全ての記憶を回収し、深く反省する。お冷が大好き。" },
      FOUT: { name: "酒飲み聖母", catch: "「お酒が強く、みんなに優しい」協調性が高く、ハイテンションでみんなを全肯定。どんな飲み会にもいてほしいハッピーな存在。" },
      FOUY: { name: "情熱のたぎりモンスター", catch: "「お酒が弱く、愛情深い」協調性は高いが、酒が弱く感情が大爆発。みんなに抱きついてしまうイチャイチャ担当。" },
      FODT: { name: "飲み飲みカウンセラー", catch: "「無言で傾聴、無限の包容力」 協調性が高いが、落ち着いてみんなの愚痴をひたすら聞く。お酒が強いので倒れない。" },
      FODY: { name: "涙腺崩壊ベビー", catch: "「泣き上戸で、かまってちゃん」協調性を大事にするが、お酒が弱すぎてすぐにダウン。みんなに慰めを求め、涙腺が崩壊する。" },
      FRUT: { name: "酔いどれ学級委員長", catch: "「ルールを守りつつ楽しむ」酔いすぎないようにセーブしながら、明るく振る舞う。最高のバランスを持つコミュ強。" },
      FRUY: { name: "飲んだふり常習犯", catch: "「本当はお酒が弱いのに、ノリで飲む」周りの雰囲気を大切にし、飲んだフリで場の空気に合わせて楽しむ。" },
      FRDT: { name: "お会計くん", catch: "「見えないところで動く」 現実的かつ冷静。会計や後片付けを完璧にこなす隠れた功労者。" },
      FRDY: { name: "空気読みすぎ天使", catch: "「お酒は弱いが、迷惑はかけない」周囲の空気を読み、潰れる前に静かに帰る気遣いの塊。" }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const typeListContainer = document.getElementById('type-list-container');
      typeListContainer.innerHTML = Object.keys(typeData).map(typeCode => {
        const type = typeData[typeCode];
        const href = `./types/${typeCode.toLowerCase()}.html`;
        return `
          <a class="type-card-link" href="${href}">
            <div class="type-card">
              <div class="type-card-image-wrapper">
                <img src="../酒タイプ画像/${typeCode}.jpg" alt="${type.name}のイラスト" class="type-card-illustration">
              </div>
              <h3 class="type-card-name">${type.name} (${typeCode})</h3>
              <p class="type-card-catchphrase">${type.catch}</p>
            </div>
          </a>
        `;
      }).join('');
    });
  </script>
