    <meta name="theme-color" content="#6a1b9a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1YJFPXNF0M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1YJFPXNF0M');
    </script>
    <title>ワリカン・傾斜電卓 - 飲み会コンテンツ</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .calc-wrapper {
            background:#fff; border-radius:24px; padding:24px 18px;
            box-shadow:0 10px 40px rgba(0,0,0,0.08); border:2px solid #10b981; margin-bottom:32px;
        }
        .sec-title {
            font-size:1rem; font-weight:900; color:#10b981;
            margin:22px 0 8px; border-bottom:2px dashed #a7f3d0; padding-bottom:6px;
        }
        /* grid rows */
        .member-row {
            display:grid; grid-template-columns:2fr 1fr 36px;
            gap:6px; align-items:center; margin-bottom:8px;
            animation:slideIn .25s ease-out;
        }
        .expense-row {
            display:grid; grid-template-columns:2fr 1.8fr 1.4fr 36px;
            gap:6px; align-items:center; margin-bottom:8px;
            animation:slideIn .25s ease-out;
        }
        .member-row input,
        .expense-row input,
        .expense-row select {
            padding:10px 12px; border-radius:10px; border:2px solid #e5e7eb;
            font-size:0.92rem; font-weight:600; width:100%; box-sizing:border-box;
            background:#f9fafb; font-family:inherit;
        }
        .member-row input:focus,
        .expense-row input:focus,
        .expense-row select:focus { border-color:#10b981; outline:none; background:#fff; }
        .btn-del {
            background:#fee2e2; color:#ef4444; border:none;
            width:36px; height:36px; min-width:36px; flex-shrink:0;
            border-radius:8px; font-size:1rem; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
        }
        .btn-del:hover { background:#fecaca; }
        .col-hdr { display:grid; gap:6px; margin-bottom:4px; padding:0 2px; }
        .col-hdr span { font-size:0.7rem; font-weight:700; color:#6b7280; }
        .btn-add {
            width:100%; padding:11px; background:#f0fdf4; color:#10b981;
            border:2px dashed #bbf7d0; border-radius:12px; font-weight:800;
            cursor:pointer; transition:all .2s; margin-bottom:4px; font-size:0.92rem;
        }
        .btn-add:hover { background:#dcfce7; border-color:#10b981; }
        .form-row { margin-bottom:14px; }
        .form-row label { display:block; font-weight:700; margin-bottom:6px; color:#374151; font-size:0.88rem; }
        .form-row select {
            width:100%; padding:11px 14px; border-radius:12px; border:2px solid #e5e7eb;
            font-size:0.92rem; font-weight:600; background:#f9fafb; box-sizing:border-box;
            font-family:inherit;
        }
        .calc-btn {
            width:100%; padding:17px; background:#10b981; color:white;
            border:none; border-radius:50px; font-size:1.15rem; font-weight:900;
            cursor:pointer; box-shadow:0 6px 20px rgba(16,185,129,.3);
            transition:all .2s; margin-top:8px; font-family:inherit;
        }
        .calc-btn:active { transform:scale(0.98); }

        /* ── result tabs ── */
        .result-panel { display:none; margin-top:28px; }
        .tab-header { display:flex; border-radius:16px 16px 0 0; overflow:hidden; }
        .tab-btn {
            flex:1; padding:12px 6px; text-align:center; font-weight:800;
            font-size:0.85rem; border:none; cursor:pointer; transition:all .2s;
            line-height:1.2; font-family:inherit;
        }
        .tab-btn.active { background:#10b981; color:white; }
        .tab-btn:not(.active) { background:#e5e7eb; color:#6b7280; }
        .tab-content {
            background:#f0fdf4; border:2px solid #10b981; border-top:none;
            border-radius:0 0 20px 20px; padding:18px; display:none;
        }
        .tab-content.active { display:block; }

        /* ── tilt table ── */
        .tilt-table {
            width:100%; border-collapse:collapse; font-size:0.88rem;
            background:white; border-radius:12px; overflow:hidden;
            box-shadow:0 2px 8px rgba(0,0,0,0.06);
        }
        .tilt-table th {
            background:#10b981; color:white; padding:10px 8px;
            text-align:center; font-weight:800; font-size:0.82rem;
            white-space:nowrap;
        }
        .tilt-table td {
            padding:10px 8px; text-align:center; border-bottom:1px solid #d1fae5;
            font-weight:600;
        }
        .tilt-table tr:last-child td { border-bottom:none; }
        .tilt-table tr:nth-child(even) td { background:#f0fdf4; }
        .td-name { text-align:left !important; font-weight:800; }
        .td-owe  { color:#ef4444; font-weight:900; }
        .td-recv { color:#10b981; font-weight:900; }
        .td-zero { color:#6b7280; }
        .tilt-table tfoot td {
            background:#065f46; color:white; font-weight:900; font-size:0.9rem;
            border-bottom:none;
        }

        /* ── settlement ── */
        .settle-row {
            background:white; border-radius:10px; padding:10px 14px;
            margin-bottom:8px; display:flex; justify-content:space-between;
            align-items:center; font-weight:bold; border:1px solid #e2e8f0;
            gap:8px; flex-wrap:wrap;
        }
        .settle-arrow { color:#10b981; font-size:1.1rem; font-weight:900; }
        .settle-amount { color:#ef4444; font-weight:900; white-space:nowrap; }

        /* ── action buttons ── */
        .action-row {
            display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;
        }
        .action-btn {
            flex:1; min-width:140px; padding:13px 10px; border:none; border-radius:50px;

        .action-btn.csv  { background:#059669; color:white; box-shadow:0 4px 14px rgba(5,150,105,.3); }
        .action-btn.copy { background:#3949ab; color:white; box-shadow:0 4px 14px rgba(57,73,171,.3); }

        .notice {
            font-size:0.75rem; text-align:center; color:#6b7280; margin-top:8px;
        }
        .toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
            background:#1e293b; color:white; padding:12px 24px; border-radius:50px;
            font-weight:800; font-size:0.9rem; z-index:9999; opacity:0;
            transition:opacity .3s; pointer-events:none; white-space:nowrap;
        }
        .toast.show { opacity:1; }

        @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

<nav class="global-header">
    <a href="../index.html" class="header-logo"><span style="font-size:1.4rem;">🍺</span><span class="text-logo">酒タイプ診断</span></a>
    <div class="header-nav"></div>
</nav>
<div class="mobile-menu" id="mobileMenu"></div>

<div class="container fade-in" style="margin-top:40px;">
<div class="calc-wrapper">
    <h1 style="color:#10b981;font-weight:900;font-size:clamp(1.3rem,5vw,1.85rem);margin-bottom:4px;word-break:keep-all;white-space:nowrap;">💸 ワリカン・傾斜電卓</h1>
    <p style="font-weight:bold;color:var(--text-muted);margin-bottom:4px;font-size:0.88rem;">立替を記録して均等／傾斜で精算。リンクで友達と共有可！</p>

    <!-- ① メンバー -->
    <div class="sec-title">① 参加メンバー</div>
    <div class="col-hdr" style="grid-template-columns:2fr 1fr 36px;">
        <span>名前</span><span>年齢</span><span></span>
    </div>
    <div id="memberList"></div>
    <button class="btn-add" onclick="addMember()">＋ メンバーを追加</button>

    <!-- ② 立替の記録 -->
    <div class="sec-title">② 立替の記録</div>
    <div class="col-hdr" style="grid-template-columns:2fr 1.8fr 1.4fr 36px;">
        <span>費目</span><span>立替者</span><span>金額</span><span></span>
    </div>
    <div id="expenseList"></div>
    <button class="btn-add" onclick="addExpense()">＋ 立替を追加</button>

    <!-- ③ 傾斜設定 -->
    <div class="sec-title">③ 傾斜設定</div>
    <div class="form-row" style="margin-bottom:0;">
        <label>年齢の高い順に上乗せする差額（均等の場合は「差額なし」を選択）</label>
        <select id="diffAmount">
            <option value="0">差額なし（均等のみ）</option>
            <option value="500">500円ずつ差を付ける</option>
            <option value="1000" selected>1000円ずつ差を付ける</option>
            <option value="2000">2000円ずつ差を付ける</option>
            <option value="3000">3000円ずつ差を付ける</option>
        </select>
    </div>

    <button class="calc-btn" onclick="calculate()">計算する！</button>

    <!-- Result Panel -->
    <div id="resultPanel" class="result-panel">
        <div class="tab-header">
            <button class="tab-btn active" onclick="showTab(0)">均等ワリカン</button>
            <button class="tab-btn" onclick="showTab(1)">傾斜表</button>
            <button class="tab-btn" onclick="showTab(2)">精算方法</button>
        </div>
        <div id="tab0" class="tab-content active"></div>
        <div id="tab1" class="tab-content"></div>
        <div id="tab2" class="tab-content"></div>
    </div>

    <!-- Action buttons (shown after calculate) -->
    <div id="actionRow" class="action-row" style="display:none;">
        <button class="action-btn csv"  onclick="exportCSV()">📥 Excelダウンロード (CSV)</button>
        <button class="action-btn copy" onclick="copyShareLink()">🔗 リンクをコピー</button>
    </div>
    <p id="shareNotice" class="notice" style="display:none;">※コピーしたリンクを友達に送ると、この内容がそのまま開けます</p>
</div>

<div class="bottom-nav-wrapper">
    <a href="./index.html" class="bottom-nav-button primary">ツール一覧に戻る</a>
    <a href="../index.html" class="bottom-nav-button" style="border:2px solid #10b981;color:#10b981;background:transparent;">酒タイプ診断TOPに戻る</a>
</div>
</div>

<!-- Toast notification -->
<div id="toast" class="toast">✅ リンクをコピーしました！</div>

<script>
/* ════════════════════════════════
   State
════════════════════════════════ */
let memberIdCnt = 0;
let expenseIdCnt = 0;
let lastResult = null;  // saved for CSV export

/* ════════════════════════════════
   Member management
════════════════════════════════ */
function addMember(name='', age='', silent=false) {
    memberIdCnt++;
    const id = `m${memberIdCnt}`;
    const div = document.createElement('div');
    div.className = 'member-row';
    div.id = id;
    div.innerHTML = `
        <input type="text"   class="mname" placeholder="名前 (任意)" value="${esc(name)}">
        <input type="number" class="mage"  placeholder="年齢" min="1" max="99" style="text-align:center;" value="${esc(age)}">
        <button class="btn-del" onclick="delRow('${id}'); refreshPayerDropdowns()">✕</button>
    `;
    document.getElementById('memberList').appendChild(div);
    div.querySelector('.mname').addEventListener('input', refreshPayerDropdowns);
    if (!silent) refreshPayerDropdowns();
}

function getMemberNames() {
    return [...document.querySelectorAll('.member-row .mname')].map(el => el.value.trim()).filter(n => n);
}

function refreshPayerDropdowns() {
    const names = getMemberNames();
    document.querySelectorAll('.payer-sel').forEach(sel => {
        const prev = sel.value;
        sel.innerHTML = `<option value="">（立替なし）</option>` +
            names.map(n => `<option value="${esc(n)}" ${n === prev ? 'selected' : ''}>${esc(n)}</option>`).join('');
    });
}

/* ════════════════════════════════
   Expense management
════════════════════════════════ */
function addExpense(cat='', payerName='', amount='') {
    expenseIdCnt++;
    const id = `e${expenseIdCnt}`;
    const names = getMemberNames();
    const options = `<option value="">（立替なし）</option>` +
        names.map(n => `<option value="${esc(n)}" ${n === payerName ? 'selected' : ''}>${esc(n)}</option>`).join('');

    const div = document.createElement('div');
    div.className = 'expense-row';
    div.id = id;
    div.innerHTML = `
        <input type="text"   class="ecat"   placeholder="例: 一次会" value="${esc(cat)}">
        <select class="payer-sel">${options}</select>
        <input type="number" class="eamt"   placeholder="¥" min="0" step="100" style="text-align:right;" value="${esc(amount)}">
        <button class="btn-del" onclick="delRow('${id}')">✕</button>
    `;
    document.getElementById('expenseList').appendChild(div);
}

function delRow(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

function esc(s) { return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

/* ════════════════════════════════
   Tab switcher
════════════════════════════════ */
function showTab(idx) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
}

/* ════════════════════════════════
   Main calculation
════════════════════════════════ */
function calculate() {
    if (typeof gtag !== 'undefined') gtag('event', 'game_action', { event_category:'engagement', event_label:'split_calculate' });

    // Collect members
    const memEls = [...document.querySelectorAll('.member-row')];
    if (memEls.length < 2) { alert('メンバーを2人以上追加してください！'); return; }
    const members = memEls.map(r => ({
        name: r.querySelector('.mname').value.trim() || '名無し',
        age:  parseInt(r.querySelector('.mage').value) || 0,
        paid: 0
    }));

    // Collect expenses
    const expEls = [...document.querySelectorAll('.expense-row')];
    if (expEls.length === 0) { alert('立替を1件以上追加してください！'); return; }
    const expenses = expEls.map(r => ({
        cat:    r.querySelector('.ecat').value.trim() || '未記入',
        payer:  r.querySelector('.payer-sel').value,
        amount: parseInt(r.querySelector('.eamt').value) || 0
    })).filter(e => e.amount > 0);

    if (expenses.length === 0) { alert('金額を入力してください！'); return; }
    const total = expenses.reduce((s, e) => s + e.amount, 0);

    // Accumulate paid amounts per member
    expenses.forEach(exp => {
        const m = members.find(m => m.name === exp.payer);
        if (m) m.paid += exp.amount;
    });

    const n = members.length;
    const diff = parseInt(document.getElementById('diffAmount').value);

    /* Equal shares */
    const baseEqual = Math.floor(total / n);
    const remEqual  = total % n;
    const equalShares = members.map((_, i) => i < remEqual ? baseEqual + 1 : baseEqual);

    /* Tilted shares — sort by age desc */
    const sorted = members.map((m, i) => ({ ...m, origIdx: i })).sort((a, b) => (b.age || 0) - (a.age || 0));
    let tiltedShares = null;
    let tiltError = null;

    if (diff > 0) {
        const sumDiffs = diff * n * (n - 1) / 2;
        const totalBase = total - sumDiffs;
        if (totalBase < 0) {
            tiltError = '差額設定が大きすぎます。差額を小さくするかメンバーを増やしてください。';
        } else {
            const baseT = Math.floor(totalBase / n);
            const remT  = totalBase % n;
            tiltedShares = new Array(n);
            sorted.forEach((m, rank) => {
                const rankBonus = (n - 1 - rank) * diff;
                const shareRem  = rank < remT ? 1 : 0;
                tiltedShares[m.origIdx] = baseT + rankBonus + shareRem;
            });
        }
    } else {
        tiltedShares = [...equalShares];
    }

    // Save for export
    lastResult = { members, expenses, total, equalShares, tiltedShares, sorted, diff, tiltError };

    // Render tabs
    document.getElementById('tab0').innerHTML = buildTable(members, equalShares, total, false, null);
    document.getElementById('tab1').innerHTML = tiltError
        ? `<p style="color:#ef4444;font-weight:bold;padding:16px;text-align:center;">${tiltError}</p>`
        : buildTable(members, tiltedShares, total, true, sorted);
    document.getElementById('tab2').innerHTML = buildSettlement(members, tiltedShares ?? equalShares, total, tiltError);

    document.getElementById('resultPanel').style.display = 'block';
    document.getElementById('actionRow').style.display = 'flex';
    document.getElementById('shareNotice').style.display = 'block';
    showTab(0);
    scrollTo({ top: document.getElementById('resultPanel').offsetTop - 80, behavior: 'smooth' });
}

/* ════════════════════════════════
   Build table HTML
════════════════════════════════ */
function buildTable(members, shares, total, isTilted, sorted) {
    const order = isTilted && sorted ? sorted.map(s => s.origIdx) : members.map((_, i) => i);

    let rows = '';
    order.forEach((idx, rank) => {
        const m = members[idx];
        const share = shares[idx];
        const net = share - m.paid;
        const netClass = net > 0 ? 'td-owe' : net < 0 ? 'td-recv' : 'td-zero';
        const netTxt = net > 0 ? `支払 ${net.toLocaleString()}` : net < 0 ? `受取 ${Math.abs(net).toLocaleString()}` : '精算なし';
        const rankBadge = isTilted ? (rank === 0 ? '👑' : rank === members.length - 1 ? '🌱' : `${rank + 1}`) : '';

        rows += `<tr>
            <td class="td-name">${rankBadge} ${m.name}${m.age ? `<br><span style="font-size:.7rem;color:#9ca3af;">${m.age}歳</span>` : ''}</td>
            <td>${share.toLocaleString()}<span style="font-size:.75rem;">円</span></td>
            <td>${m.paid.toLocaleString()}<span style="font-size:.75rem;">円</span></td>
            <td class="${netClass}">${netTxt}<span style="font-size:.75rem;">円</span></td>
        </tr>`;
    });

    const diffNote = isTilted && lastResult && lastResult.diff > 0
        ? `<p style="font-size:.76rem;color:#6b7280;margin-top:10px;">※年齢順に並び替え。隣の順位との差額: ${lastResult.diff.toLocaleString()}円</p>` : '';

    return `
        <table class="tilt-table">
            <thead>
                <tr>
                    <th>名前</th>
                    <th>担当額</th>
                    <th>立替額</th>
                    <th>精算</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>
                <tr>
                    <td colspan="1" class="td-name" style="color:white;">合計</td>
                    <td colspan="3" style="color:white;">${total.toLocaleString()} 円</td>
                </tr>
            </tfoot>
        </table>
        ${diffNote}
        <p style="font-size:.72rem;color:#9ca3af;margin-top:6px;">※端数は可能な限り均等に分配しています</p>`;
}

/* ════════════════════════════════
   Build settlement HTML
════════════════════════════════ */
function buildSettlement(members, shares, total, tiltError) {
    const nets = members.map((m, i) => shares[i] - m.paid);
    const payers   = members.map((m, i) => ({ name: m.name, net: nets[i] })).filter(x => x.net > 0);
    const receivers = members.map((m, i) => ({ name: m.name, net: -nets[i] })).filter(x => x.net > 0);

    if (payers.length === 0) {
        return `<p style="font-weight:bold;color:#10b981;text-align:center;padding:16px;">全員精算済みです！お疲れ様でした🎉</p>`;
    }

    const p = payers.map(x => ({ ...x }));
    const r = receivers.map(x => ({ ...x }));
    let html = '<div>';
    let pi = 0, ri = 0;
    while (pi < p.length && ri < r.length) {
        const transfer = Math.min(p[pi].net, r[ri].net);
        if (transfer > 0) {
            html += `<div class="settle-row">
                <span style="font-weight:800;">${p[pi].name}</span>
                <span class="settle-arrow">→</span>
                <span style="font-weight:800;">${r[ri].name}</span>
                <span class="settle-amount">${transfer.toLocaleString()} 円</span>
            </div>`;
        }
        p[pi].net -= transfer;
        r[ri].net -= transfer;
        if (p[pi].net <= 0) pi++;
        if (r[ri].net <= 0) ri++;
    }
    html += `</div>`;
    if (tiltError) {
        html += `<p style="color:#6b7280;font-size:.8rem;text-align:center;margin-top:8px;">※傾斜エラーのため均等ワリカンで精算しています</p>`;
    }
    return html;
}

/* ════════════════════════════════
   CSV Export
════════════════════════════════ */
function exportCSV() {
    if (!lastResult) return;
    const { members, expenses, total, equalShares, tiltedShares, sorted, diff } = lastResult;

    const bom = '\ufeff';  // UTF-8 BOM for Excel
    const lines = [];

    lines.push(['ワリカン・傾斜電卓', '', '', '', '', '']);
    lines.push(['合計金額', total + '円', '', '', '', '']);
    lines.push(['傾斜差額', diff > 0 ? `${diff}円/順位` : '差額なし', '', '', '', '']);
    lines.push([]);

    // Member table
    lines.push(['名前', '年齢', '担当額(均等)', '担当額(傾斜)', '立替額', '精算(傾斜)']);

    const order = sorted ? sorted.map(s => s.origIdx) : members.map((_, i) => i);
    order.forEach((idx, rank) => {
        const m = members[idx];
        const tShare = tiltedShares ? tiltedShares[idx] : equalShares[idx];
        const net = tShare - m.paid;
        const netTxt = net > 0 ? `支払 ${net}円` : net < 0 ? `受取 ${Math.abs(net)}円` : '精算なし';
        lines.push([m.name, m.age || '', equalShares[idx], tShare, m.paid, netTxt]);
    });

    lines.push([]);
    lines.push(['【立替一覧】']);
    lines.push(['費目', '立替者', '金額']);
    expenses.forEach(e => lines.push([e.cat, e.payer || '（なし）', e.amount]));

    const csv = bom + lines.map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ワリカン傾斜表.csv'; a.click();
    URL.revokeObjectURL(url);
}

/* ════════════════════════════════
   URL Share (encode form state in URL)
════════════════════════════════ */
function getFormState() {
    const members = [...document.querySelectorAll('.member-row')].map(r => ({
        name: r.querySelector('.mname').value.trim(),
        age:  r.querySelector('.mage').value
    }));
    const expenses = [...document.querySelectorAll('.expense-row')].map(r => ({
        cat:   r.querySelector('.ecat').value.trim(),
        payer: r.querySelector('.payer-sel').value,
        amt:   r.querySelector('.eamt').value
    }));
    const diff = document.getElementById('diffAmount').value;
    return { members, expenses, diff };
}

function encodeState(state) {
    try { return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }
    catch(e) { return null; }
}

function decodeState(str) {
    try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
    catch(e) { return null; }
}

function copyShareLink() {
    const state = getFormState();
    const encoded = encodeState(state);
    if (!encoded) { alert('データのエンコードに失敗しました。'); return; }
    const url = location.origin + location.pathname + '?d=' + encoded;
    navigator.clipboard.writeText(url).then(() => showToast('✅ リンクをコピーしました！')).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        showToast('✅ リンクをコピーしました！');
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

/* ════════════════════════════════
   Load state from URL on page load
════════════════════════════════ */
function loadFromURL() {
    const params = new URLSearchParams(location.search);
    if (!params.has('d')) {
        // Default rows if no data
        addMember(); addMember();
        addExpense();
        return;
    }
    const state = decodeState(params.get('d'));
    if (!state) return;

    // Clear initial or default state if any
    document.getElementById('memberList').innerHTML = '';
    document.getElementById('expenseList').innerHTML = '';

    // Populate members first (silent to avoid multiple refreshes)
    (state.members || []).forEach(m => addMember(m.name, m.age, true));
    refreshPayerDropdowns();

    // Then expenses
    (state.expenses || []).forEach(e => addExpense(e.cat, e.payer, e.amt));
    
    // Set diff
    if (state.diff !== undefined) {
        document.getElementById('diffAmount').value = state.diff;
    }

    // Auto calculate if we have data
    if ((state.members || []).length >= 2 && (state.expenses || []).length > 0) {
        setTimeout(() => {
            calculate();
            showToast('📋 共有されたデータを復元しました！');
        }, 100);
    }
}

/* ════════════════════════════════
   Init
════════════════════════════════ */
document.addEventListener('DOMContentLoaded', loadFromURL);
