<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="theme-color" content="#6a1b9a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山手線ゲーム お題ガチャ - 飲み会ツール</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .game-wrapper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            border: 2px solid var(--brand-purple-light);
        }
        .slot-container {
            height: 120px;
            background: #f8fafc;
            border: 4px solid var(--brand-purple);
            border-radius: 16px;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 900;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }
        .slot-text { transition: transform 0.1s; }
        .spin-btn {
            background: linear-gradient(135deg, var(--brand-purple), #9c27b0);
            color: white; font-size: 1.5rem; font-weight: 800;
            padding: 16px 40px; border-radius: 50px; border: none;
            box-shadow: 0 6px 20px rgba(106, 27, 154, 0.4); cursor: pointer;
            transition: all 0.2s;
        }
        .spin-btn:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(106, 27, 154, 0.4); }
        .spin-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>
    <nav class="global-header">
        <a href="../index.html" class="header-logo"><span style="font-size:1.4rem;">🍺</span><span class="text-logo">酒タイプ診断</span></a>
        <div class="header-nav"><a href="./index.html">← ツール一覧へ戻る</a></div>
        <button class="menu-toggle" aria-label="Menu" onclick="document.getElementById('mobileMenu').classList.toggle('active')">☰</button>
    </nav>
    <div class="mobile-menu" id="mobileMenu"><a href="./index.html">← ツール一覧へ戻る</a></div>

    <div class="container fade-in" style="margin-top:40px;">
        <div class="game-wrapper">
            <h1 style="color:var(--brand-purple); font-weight:900; font-size:2rem; margin-bottom:10px;">🎰 お題ガチャ</h1>
            <p style="font-weight:bold; color:var(--text-muted);">山手線ゲーム（古今東西）のお題をランダム決定！</p>
            
            <div class="slot-container">
                <div class="slot-text" id="slotText">ここにお題が出ます</div>
            </div>
            
            <button class="spin-btn" id="spinBtn" onclick="spin()">お題を引く！</button>
        </div>
    </div>

    <script>
        const topics = [
            "居酒屋の定番メニュー", "お酒の失敗談", "ジブリのキャラクター", "ドラえもんのひみつ道具",
            "歴代の総理大臣", "コンビニの名前", "マクドナルドのおにぎり...じゃなくて商品", "初恋の人の名前のイニシャル",
            "山手線の駅名", "47都道府県", "100円ショップで買えるもの", "スマホのアプリ",
            "無人島に一つ持っていくなら", "今一番欲しいもの", "有名人のスキャンダル", "お酒の名前"
        ];
        
        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const slot = document.getElementById('slotText');
            btn.disabled = true;
            
            let count = 0;
            const maxSpins = 20;
            const interval = setInterval(() => {
                slot.innerText = topics[Math.floor(Math.random() * topics.length)];
                slot.style.transform = `translateY(${Math.random() * 10 - 5}px)`;
                count++;
                
                if (count >= maxSpins) {
                    clearInterval(interval);
                    slot.style.transform = "translateY(0)";
                    slot.style.color = "var(--brand-purple)";
                    isSpinning = false;
                    btn.disabled = false;
                    btn.innerText = "もう一度引く！";
                    
                    // Add subtle pop animation
                    slot.style.transform = "scale(1.1)";
                    setTimeout(() => slot.style.transform = "scale(1)", 200);
                }
            }, 50);
            
            slot.style.color = "var(--text-main)";
        }
    </script>
</body>
</html>
