<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="theme-color" content="#6a1b9a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1YJFPXNF0M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1YJFPXNF0M');
    </script>

    <title>酒タイプルーレット - 16タイプ飲み会コンテンツ</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .game-wrapper {
            background: #fff; border-radius: 24px; padding: 40px 20px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: 2px solid #ef4444; margin-bottom: 40px;
        }
        
        .char-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0;
            max-width: 400px; margin-left: auto; margin-right: auto;
        }
        .char-icon {
            width: 100%; aspect-ratio: 1; border-radius: 12px; border: 3px solid transparent;
            object-fit: cover; cursor: pointer; transition: all 0.2s; filter: grayscale(1) opacity(0.4);
        }
        .char-icon.selected {
            filter: grayscale(0) opacity(1); border-color: #ef4444; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
            transform: scale(1.1);
        }
        
        /* Real Roulette UI */
        .roulette-container {
            position: relative; width: 300px; height: 300px; margin: 30px auto;
        }
        .spin-pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-top: 30px solid #ef4444; z-index: 10; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        .roulette-wheel {
            width: 100%; height: 100%; border-radius: 50%;
            border: 6px solid #1e293b; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1);
            background: #f8fafc;
        }
        
        .btn-spin {
            background: #ef4444; color: white; font-size: 1.5rem; font-weight: 900;
            padding: 16px 50px; border-radius: 50px; border: none; cursor: pointer;
            box-shadow: 0 6px 0 #b91c1c; transition: transform 0.1s, box-shadow 0.1s;
            width: 100%; max-width: 300px; margin-top:20px;
        }
        .btn-spin:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 #b91c1c; }
        .btn-spin:disabled { background: #ccc; box-shadow: 0 6px 0 #999; cursor:not-allowed; }
        
        .winner-panel {
            display: none; background: #fef2f2; border: 2px dashed #fca5a5;
            border-radius: 16px; padding: 20px; margin-top: 30px; animation: popIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        .winner-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #ef4444; object-fit: cover; margin-bottom: 10px;}
        .winner-title { font-size: 1.5rem; font-weight: 900; color: #b91c1c; margin-bottom: 10px; }
        .winner-copy { font-size: 1rem; font-weight: bold; color: #475569; line-height: 1.4; overflow-wrap: break-word; word-break: normal; }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <nav class="global-header">
        <a href="../index.html" class="header-logo"><span style="font-size:1.4rem;">🍺</span><span class="text-logo">酒タイプ診断</span></a>
        <div class="header-nav"></div>
    </nav>
    <div class="mobile-menu" id="mobileMenu"></div>

    <div class="container fade-in" style="margin-top:40px;">
        <div class="game-wrapper" style="margin-bottom: 20px;">
            <h1 style="color:#ef4444; font-weight:900; font-size:2.2rem; margin-bottom:5px; word-break:keep-all;">🎯 酒タイプルーレット</h1>
            <p style="font-weight:bold; color:var(--text-muted); margin-bottom:10px; word-break:keep-all;">参加メンバーをタップ！ルーレット開始！</p>
            
            <div class="char-grid" id="grid">
                <!-- Injected via JS -->
            </div>

            <!-- Real SVG/Canvas Wheel -->
            <div class="roulette-container" id="wheelContainer" style="display:none;">
                <div class="spin-pointer"></div>
                <canvas id="rouletteWheel" class="roulette-wheel" width="600" height="600"></canvas>
            </div>
            
            <div class="winner-panel" id="winnerPanel">
                <img id="winnerImg" class="winner-img" src="">
                <div class="winner-title" id="winnerTitle" style="word-break: normal; overflow-wrap: break-word;"></div>
                <div class="winner-copy" id="winnerCopy" style="word-break: normal; overflow-wrap: break-word;"></div>
            </div>
            
            <button class="btn-spin" id="btnSpin" onclick="spin()" style="word-break:keep-all; line-height:1.3; font-size: clamp(1.2rem, 4vw, 1.5rem); padding: 16px 20px;">ルーレット<br>スタート！</button>
            <p id="alertMsg" style="color:#ef4444; font-weight:bold; margin-top:10px;"></p>
        </div>

        <div class="bottom-nav-wrapper">
            <a href="./index.html" class="bottom-nav-button primary">ツール一覧に戻る</a>
            <a href="../index.html" class="bottom-nav-button" style="border:2px solid var(--brand-purple); color:var(--brand-purple); background:transparent;">酒タイプ診断TOPに戻る</a>
        </div>
    </div>

    <script>
        const types = ["FODT", "FODY", "FOUT", "FOUY", "FRDT", "FRDY", "FRUT", "FRUY", "LODT", "LODY", "LOUT", "LOUY", "LRDT", "LRDY", "LRUT", "LRUY"];
        
        // 固有の煽り・気遣いコピー
        const copies = {
            "FODT": "飲み飲みカウンセラー！無言で傾聴！お酒が強いから全然平気でしょ？🍻",
            "FODY": "涙腺崩壊ベビー！泣き上戸注意！泣きながら飲んで！🍻",
            "FOUT": "酒飲み聖母！みんなのハッピーのために優しい一杯を！🍻",
            "FOUY": "情熱のたぎりモンスター！今すぐ誰かに抱きついて飲んで！🍻",
            "FRDT": "お会計くん！見えないところで動くあなた、たまには自分が主役で飲んで！🍻",
            "FRDY": "空気読みすぎ天使！空気を読んで美しく一口どうぞ！🍻",
            "FRUT": "酔いどれ学級委員長！バランス良く綺麗に飲み干して！🍻",
            "FRUY": "飲んだふり常習犯！今日はフリじゃなくてガチで一口どうぞ！🍻",
            "LODT": "飲み参謀！計算通りの酔い方で冷静に飲み干して！🍻",
            "LODY": "爆発インキャ！愚痴る前にとりあえず黙って飲んで！🍻",
            "LOUT": "アル中番長！場の主導権を手放さず豪快にいけ！🍻",
            "LOUY": "ハイテンション時限爆弾！そろそろ爆発しちゃいそう？！無理しすぎず飲んでください！🍻",
            "LRDT": "朝までうんちく先輩！語り出す前に一杯飲み干しましょう！🍻",
            "LRDY": "水泥棒！後でお水も飲む約束で今は一杯どうぞ！🍻",
            "LRUT": "自称プロ幹事！自分で設定したペナルティ！元気よくどうぞ！🍻",
            "LRUY": "ちゃんとした人！終電で帰る前にキッチリ飲み干して！🍻"
        };
        
        let selectedItems = [];
        let currentRotation = 0;
        let isSpinning = false;
        
        // Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.value = 800;
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        // Render Grid
        const grid = document.getElementById('grid');
        types.forEach(type => {
            const img = document.createElement('img');
            img.src = `../../酒タイプ画像/${type}.jpg`;
            img.className = 'char-icon';
            img.onclick = () => {
                if(isSpinning) return;
                const idx = selectedItems.indexOf(type);
                if(idx > -1) {
                    selectedItems.splice(idx, 1);
                    img.classList.remove('selected');
                } else {
                    selectedItems.push(type);
                    img.classList.add('selected');
                }
                drawWheel();
            };
            grid.appendChild(img);
        });

        // Preload Images
        const loadedImages = {};
        types.forEach(type => {
            const img = new Image();
            img.src = `../../酒タイプ画像/${type}.jpg`;
            loadedImages[type] = img;
        });

        // Draw Canvas Wheel
        function drawWheel() {
            const canvas = document.getElementById('rouletteWheel');
            const ctx = canvas.getContext('2d');
            const cw = canvas.width;
            const ch = canvas.height;
            const cx = cw / 2;
            const cy = ch / 2;
            const radius = cw / 2;
            
            ctx.clearRect(0, 0, cw, ch);
            
            if(selectedItems.length < 2) {
                document.getElementById('wheelContainer').style.display = 'none';
                return;
            }
            
            document.getElementById('wheelContainer').style.display = 'block';
            
            const sliceAngle = (2 * Math.PI) / selectedItems.length;
            
            selectedItems.forEach((type, i) => {
                const startAngle = i * sliceAngle - Math.PI/2 - sliceAngle/2; 
                const endAngle = startAngle + sliceAngle;
                
                // Draw slice background (alternating colors for contrast)
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#f1f5f9';
                ctx.fill();
                ctx.stroke();
                
                // Draw image in slice
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                
                const img = loadedImages[type];
                if(img && img.complete) {
                    // Safe bounding math: Image must fit inside the slice width at Distance `d`
                    // Arc length or chord length = 2 * Distance * sin(theta/2)
                    // We apply a 0.7 multiplier so it doesn't touch the lines
                    const d = radius * 0.7;
                    const maxImgSize = 2 * d * Math.sin(sliceAngle / 2) * 0.8;
                    const imgSize = Math.max(20, Math.min(radius * 0.4, maxImgSize));
                    
                    ctx.beginPath();
                    ctx.arc(d, 0, imgSize/2, 0, Math.PI*2);
                    ctx.clip();
                    ctx.drawImage(img, d - imgSize/2, -imgSize/2, imgSize, imgSize);
                }
                ctx.restore();
                
                // Draw separator
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(startAngle) * radius, cy + Math.sin(startAngle) * radius);
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#cbd5e1';
                ctx.stroke();
            });
        }

        // Spin logic
        function spin() {
            if(selectedItems.length < 2) {
                document.getElementById('alertMsg').innerText = "ルーレットを回すには2キャラ以上選択してください！";
                return;
            }
            if(isSpinning) return;
            
            if (typeof gtag !== "undefined") {
                gtag('event', 'game_action', { 'event_category': 'engagement', 'event_label': 'roulette_spin' });
            }
            isSpinning = true;
            document.getElementById('alertMsg').innerText = "";
            document.getElementById('winnerPanel').style.display = 'none';
            document.getElementById('btnSpin').disabled = true;
            
            // Randomize target
            const targetIndex = Math.floor(Math.random() * selectedItems.length);
            // Calculate slice degrees
            const degreesPerSlice = 360 / selectedItems.length;
            
            // We want the wheel to spin at least 5 times (1800 deg)
            const spins = 5 * 360;
            // Target angle to land the pointer (top center) on the target slice.
            // Pointer is at 0 degrees top relative to wheel. Wheel's slice 0 is centered at top.
            // So slice i center is at i * degreesPerSlice.
            // To bring slice i to the top, we must rotate the wheel by - (i * degreesPerSlice) 
            const finalRotation = spins - (targetIndex * degreesPerSlice);
            
            // Add some randomness within the slice so it doesn't always land dead center
            const randomOffset = (Math.random() - 0.5) * (degreesPerSlice * 0.8);
            
            const targetRotation = currentRotation + finalRotation + randomOffset;
            
            // Apply CSS Transition
            const wheel = document.getElementById('rouletteWheel');
            wheel.style.transform = `rotate(${targetRotation}deg)`;
            
            // Tick sound intervals using requestAnimationFrame
            const duration = 4000;
            const startTime = performance.now();
            let lastTickRot = currentRotation;
            
            function animateAudio(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // cubic-bezier(0.1, 0.9, 0.2, 1) approximation for rotation delta
                const easeOutQuad = 1 - Math.pow(1 - progress, 3);
                const currentAnimatedRot = currentRotation + (targetRotation - currentRotation) * easeOutQuad;
                
                // Check if we passed a boundary
                if(Math.floor(currentAnimatedRot / degreesPerSlice) > Math.floor(lastTickRot / degreesPerSlice)) {
                    playTick();
                    lastTickRot = currentAnimatedRot;
                }
                
                if(progress < 1) {
                    requestAnimationFrame(animateAudio);
                }
            }
            requestAnimationFrame(animateAudio);
            
            // On Complete
            setTimeout(() => {
                isSpinning = false;
                currentRotation = targetRotation % 360;
                // keep it constrained so it doesn't overflow memory with huge deg over multiple spins
                wheel.style.transition = 'none';
                wheel.style.transform = `rotate(${currentRotation}deg)`;
                // force reflow
                void wheel.offsetWidth;
                wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0.9, 0.2, 1)';
                
                showWinner(selectedItems[targetIndex]);
            }, duration + 200);
        }
        
        function showWinner(type) {
            document.getElementById('winnerImg').src = `../../酒タイプ画像/${type}.jpg`;
            document.getElementById('winnerTitle').innerText = "🍻 決まり！さぁ飲んで！";
            document.getElementById('winnerCopy').innerText = copies[type];
            document.getElementById('winnerPanel').style.display = 'block';
            
            const btn = document.getElementById('btnSpin');
            btn.disabled = false;
            btn.innerText = "もう一度回す";
        }

        // Add a check to redraw once all images are actually loaded 
        // to prevent empty slices on fast connections
        let loadedCount = 0;
        types.forEach(type => {
            if(loadedImages[type].complete) loadedCount++;
            else {
                loadedImages[type].onload = () => {
                    loadedCount++;
                    if(loadedCount === types.length) drawWheel();
                }
            }
        });
    </script>
    
</body>
</html>
