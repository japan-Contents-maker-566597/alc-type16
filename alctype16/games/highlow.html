<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="theme-color" content="#6a1b9a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒飲み ハイ＆ロー - 飲み会ツール</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .game-wrapper {
            background: #0f172a; color: white;
            border-radius: 24px; padding: 40px 20px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); margin-bottom: 40px;
        }
        .card-stage {
            display: flex; justify-content: center; gap: 20px; margin: 30px 0; perspective: 1000px;
        }
        .playing-card {
            width: 140px; height: 200px; background: white; border-radius: 12px;
            color: black; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: 900; box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 8px 15px rgba(0,0,0,0.3);
            position: relative; transition: transform 0.6s; transform-style: preserve-3d;
        }
        .playing-card.hidden { background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #0f172a 10px, #0f172a 20px); border: 4px solid white; color: transparent; }
        .card-char { width: 70px; height: 70px; object-fit: cover; border-radius: 50%; border: 2px solid #ccc; margin-top: 10px; }
        .suit { font-size: 1.5rem; position: absolute; top: 10px; left: 10px; }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn-hl {
            padding: 15px 30px; font-size: 1.5rem; font-weight: 900; border: none; border-radius: 12px;
            cursor: pointer; transition: transform 0.2s; flex: 1; max-width: 150px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-hl:active { transform: scale(0.95); }
        .btn-high { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-low { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-hl:disabled { opacity: 0.5; cursor: not-allowed; }

        #result-msg { font-size: 2rem; font-weight: 900; height: 50px; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .penalty { color: #f87171; animation: shake 0.5s infinite; }
        .success { color: #4ade80; }
        
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>
    <nav class="global-header">
        <a href="../index.html" class="header-logo"><span style="font-size:1.4rem;">🍺</span><span class="text-logo">酒タイプ診断</span></a>
        <div class="header-nav"><a href="./index.html">← ツール一覧へ戻る</a></div>
        <button class="menu-toggle" onclick="document.getElementById('mobileMenu').classList.toggle('active')">☰</button>
    </nav>
    <div class="mobile-menu" id="mobileMenu"><a href="./index.html">← ツール一覧へ戻る</a></div>

    <div class="container fade-in" style="margin-top:40px;">
        <div class="game-wrapper">
            <h1 style="color:#fcd34d; font-weight:900; font-size:2.2rem; margin-bottom:5px;">🃏 酒飲み ハイ＆ロー</h1>
            <p style="color:#94a3b8; font-weight:bold; margin-bottom:20px;">右のカードの数字は、左より「高い」か「低い」か？<br>外れたら容赦なく罰ゲーム（飲む）！</p>
            
            <div id="result-msg">さぁ、予想しろ！</div>

            <div class="card-stage">
                <div class="playing-card" id="card-left">
                    <span class="suit">♠</span>
                    <span class="val">7</span>
                    <img src="../../酒タイプ画像/FRDY.jpg" class="card-char" id="char-left" alt="char">
                </div>
                <div class="playing-card hidden" id="card-right">?</div>
            </div>

            <div class="controls">
                <button class="btn-hl btn-high" id="btn-high" onclick="guess('high')">HIGH ↑</button>
                <button class="btn-hl btn-low" id="btn-low" onclick="guess('low')">LOW ↓</button>
            </div>
            
            <button onclick="nextRound()" id="btn-next" style="display:none; margin: 30px auto 0; padding:12px 30px; border-radius:50px; background:#f59e0b; font-weight:bold; border:none; cursor:pointer;">次のラウンドへ</button>
        </div>
    </div>

    <script>
        const types = ["FRDY", "FRDT", "FRSY", "FRST", "FOUY", "FOUT", "FOSY", "FOST", "LRDY", "LRDT", "LRSY", "LRST", "LOUY", "LOUT", "LOSY", "LOST"];
        const suits = ["♠", "♥", "♦", "♣"];
        
        let currentVal = 0;
        let nextVal = 0;
        let nextCardHtml = "";

        function getCardHTML(val, suitInd, typeInd) {
            const displayVal = val === 1 ? 'A' : val === 11 ? 'J' : val === 12 ? 'Q' : val === 13 ? 'K' : val;
            const color = (suitInd === 1 || suitInd === 2) ? 'red' : 'black';
            return `
                <span class="suit" style="color:${color}">${suits[suitInd]}</span>
                <span class="val" style="color:${color}">${displayVal}</span>
                <img src="../../酒タイプ画像/${types[typeInd]}.jpg" class="card-char" alt="${types[typeInd]}">
            `;
        }

        function initRound() {
            currentVal = Math.floor(Math.random() * 13) + 1;
            document.getElementById('card-left').innerHTML = getCardHTML(currentVal, Math.floor(Math.random()*4), Math.floor(Math.random()*16));
            
            // Ensure next is different
            do { nextVal = Math.floor(Math.random() * 13) + 1; } while(nextVal === currentVal);
            nextCardHtml = getCardHTML(nextVal, Math.floor(Math.random()*4), Math.floor(Math.random()*16));

            document.getElementById('card-right').className = 'playing-card hidden';
            document.getElementById('card-right').innerHTML = '?';
            
            document.getElementById('result-msg').className = '';
            document.getElementById('result-msg').innerHTML = 'HIGH か LOW か？';
            
            document.getElementById('btn-high').disabled = false;
            document.getElementById('btn-low').disabled = false;
            document.getElementById('btn-next').style.display = 'none';
        }

        function guess(choice) {
            document.getElementById('btn-high').disabled = true;
            document.getElementById('btn-low').disabled = true;
            
            const rightCard = document.getElementById('card-right');
            rightCard.className = 'playing-card';
            rightCard.innerHTML = nextCardHtml;

            const isHigh = nextVal > currentVal;
            const isCorrect = (choice === 'high' && isHigh) || (choice === 'low' && !isHigh);
            
            const msg = document.getElementById('result-msg');
            if (isCorrect) {
                msg.innerHTML = "✨ セーフ！見事回避！ ✨";
                msg.className = 'success';
            } else {
                msg.innerHTML = "🍻 アウト！さぁ飲め！ 🍻";
                msg.className = 'penalty';
            }
            
            document.getElementById('btn-next').style.display = 'block';
        }

        // Setup first game
        initRound();
        function nextRound() { initRound(); }
    </script>
</body>
</html>
