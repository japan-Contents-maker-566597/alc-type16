    <div id="roulette-fab">🎡</div>

    <div id="roulette-overlay" class="overlay">
        <div class="modal">
            <span class="close-btn" id="close-roulette">&times;</span>
            <h2>誰が回す？</h2>
            <p>診断済みのメンバーを選択してください</p>
            <div class="member-list" id="roulette-member-list">

    <div id="result-overlay" class="overlay">
        <div class="modal">
            <span class="close-btn" id="close-result">&times;</span>
            <div id="wheel-container">
                <div id="wheel-pointer"></div>
                <canvas id="wheel-canvas" width="300" height="300"></canvas>
            </div>
            <div id="spin-result" style="display:none;">
                <h2 id="winner-name"></h2>
                <button id="spin-again-btn">もう一度</button>
            </div>
        </div>
    </div>

    <script>
        const typeData = {
            'A': { name: '陽気な酒豪', color: '#FF5722' },
            'B': { name: '静かな哲学者', color: '#2196F3' },
            'C': { name: '介抱の達人', color: '#4CAF50' },
            'D': { name: '絡み酒の王', color: '#E91E63' },
            'E': { name: '記憶喪失の神', color: '#9C27B0' },
            'F': { name: '説教マシーン', color: '#795548' },
            'G': { name: '泣き上戸の天使', color: '#FFEB3B' },
            'H': { name: '笑い上戸の妖精', color: '#00BCD4' },
            'I': { name: '脱走兵', color: '#607D8B' },
            'J': { name: '注文リーダー', color: '#FF9800' },
            'K': { name: '撮影担当', color: '#3F51B5' },
            'L': { name: 'SNS実況者', color: '#03A9F4' },
            'M': { name: '寝落ちの達人', color: '#673AB7' },
            'N': { name: '無限おかわり', color: '#FFC107' },
            'O': { name: 'ダンスホール', color: '#F44336' },
            'P': { name: '千鳥足の貴公子', color: '#8BC34A' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const rouletteFab = document.getElementById('roulette-fab');
            const rouletteOverlay = document.getElementById('roulette-overlay');
            const resultOverlay = document.getElementById('result-overlay');
            const closeRouletteBtn = document.getElementById('close-roulette');
            const closeResultBtn = document.getElementById('close-result');
            const spinBtn = document.getElementById('spin-btn');
            const spinAgainBtn = document.getElementById('spin-again-btn');
            const canvas = document.getElementById('wheel-canvas');
            const ctx = canvas.getContext('2d');

            let selectedMembers = [];
            let currentRotation = 0;

            function drawWheel(members) {
                const sliceAngle = (2 * Math.PI) / members.length;
                members.forEach((m, i) => {
                    ctx.beginPath();
                    ctx.fillStyle = typeData[m].color;
                    ctx.moveTo(150, 150);
                    ctx.arc(150, 150, 145, i * sliceAngle, (i + 1) * sliceAngle);
                    ctx.fill();
                    
                    ctx.save();
                    ctx.translate(150, 150);
                    ctx.rotate(i * sliceAngle + sliceAngle / 2);
                    ctx.textAlign = "right";
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillText(typeData[m].name, 130, 5);
                    ctx.restore();
                });
            }

            function spin() {
                const members = Array.from(document.querySelectorAll('.member-item input:checked')).map(el => el.value);
                if (members.length === 0) {
                    alert('メンバーを1人以上選択してください');
                    return;
                }

                rouletteOverlay.classList.remove('visible');
                resultOverlay.classList.add('visible');
                
                drawWheel(members);
                
                spinBtn.disabled = true;
                const extraSpins = 5 + Math.random() * 5;
                const finalRotation = extraSpins * 2 * Math.PI;
                
                const startTime = performance.now();
                const duration = 4000;

                function animate(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    
                    const rotation = easeOut * finalRotation;
                    canvas.style.transform = `rotate(${rotation}rad)`;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        const actualRotation = rotation % (2 * Math.PI);
                        const sliceAngle = (2 * Math.PI) / members.length;
                        // ポインターが真上（-Math.PI/2）にあるため調整
                        const winningIndex = members.length - 1 - Math.floor(((actualRotation + Math.PI/2) % (2 * Math.PI)) / sliceAngle);
                        const winner = members[(winningIndex + members.length) % members.length];
                        
                        document.getElementById('winner-name').textContent = typeData[winner].name + 'さん！';
                        document.getElementById('spin-result').style.display = 'block';
                    }
                }
                requestAnimationFrame(animate);
            }

            rouletteFab.addEventListener('click', () => {
                rouletteOverlay.classList.add('visible');
                rouletteFab.style.opacity = '0';
            });

            closeRouletteBtn.addEventListener('click', () => {
                rouletteOverlay.classList.remove('visible');
                rouletteFab.style.opacity = '1';
            });

            window.addEventListener('click', (e) => {
                if (e.target === rouletteOverlay) {
                    rouletteOverlay.classList.remove('visible');
                    rouletteFab.style.opacity = '1';
                }
            });

            spinBtn.addEventListener('click', spin);

            spinAgainBtn.addEventListener('click', () => {
                document.getElementById('spin-result').style.display = 'none';
                spinBtn.disabled = false;
                spin();
            });

            closeResultBtn.addEventListener('click', () => {
                resultOverlay.classList.remove('visible');
                rouletteOverlay.classList.remove('visible');
                rouletteFab.style.opacity = '1';
                spinBtn.disabled = false;
                document.getElementById('spin-result').style.display = 'none';
            });

            function renderRouletteSetupList() {
                const listContainer = document.getElementById('roulette-member-list');
                listContainer.innerHTML = Object.keys(typeData).map(typeCode => {
                    const type = typeData[typeCode];
                    return `
                        <div class="member-item">
                            <img src="./酒タイプ画像/${typeCode}.jpg" alt="${type.name}">
                            <label for="member-${typeCode}">${type.name}</label>&nbsp;
                            <input type="checkbox" id="member-${typeCode}" value="${typeCode}" checked>
                        </div>
                    `;
                }).join('');
            }

            renderRouletteSetupList();
        });
    </script>
