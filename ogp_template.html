<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OGP Template</title>
  <style>
    @font-face {
      font-family: 'MPLUSRounded';
      src: url('MPLUSRounded1c-Bold.ttf') format('truetype');
      font-weight: bold;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #FFB7B2, #ffdfd3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'MPLUSRounded', 'Yu Gothic UI', 'Meiryo', sans-serif;
    }
    .card {
      position: relative;
      width: 1040px;
      height: 470px;
      background: rgba(255,255,255,0.85);
      border-radius: 40px;
      padding: 40px;
      box-sizing: border-box;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .logo {
      position: absolute;
      top: -70px;
      right: -70px;
      font-size: 48px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }
    .content {
      position: relative;
      width: 580px; /* Strict width to leave enough space for 350px character + margins */
      z-index: 10;
    }
    .header {
      font-size: 32px;
      color: #777777;
      margin-bottom: 10px;
    }
    .catch {
      font-size: 34px;
      font-weight: bold;
      color: #ff6b81;
      margin-bottom: 15px;
      line-height: 1.3;
      word-break: break-all;
    }
    .type-name {
      font-size: 72px;
      font-weight: bold;
      color: #333333;
      margin-bottom: 20px;
      line-height: 1.1;
      white-space: nowrap; /* Measured by JS for shrinking */
    }
    .cta {
      position: absolute;
      bottom: 25px;
      left: 30px;
      width: 320px;
      height: 70px;
      background: #e53935;
      border-radius: 35px;
      color: #ffffff;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
      z-index: 20;
    }
    .cta .icon {
      margin-right: 10px;
      font-size: 24px;
    }
    .character {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 380px;
      height: 380px;
      border-radius: 50%;
      overflow: hidden;
      border: 12px solid #fff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      z-index: 1;
      background: #fff;
    }
    .character img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏫 大学生タイプ診断</div>
    <div class="content">
      <div class="header">私の大学生タイプは…</div>
      <div class="catch" id="catchphrase">{CATCHPHRASE}</div>
      <div class="type-name" id="typename">{TYPE_NAME}</div>
    </div>
    <div class="cta"><span class="icon">🔎</span>今すぐ診断！</div>
    <div class="character"><img src="{CHAR_IMG}" alt="character" /></div>
  </div>
  <script>
    /**
     * Shrink font size until element fits in maxWidth
     */
    function adjustFontSize(id, maxWidth, startSize, minSize) {
      const el = document.getElementById(id);
      if (!el) return;
      
      let size = startSize;
      el.style.fontSize = size + 'px';
      
      // For type-name, we want it on one line but shrunk
      if (id === 'typename') {
        while (el.scrollWidth > maxWidth && size > minSize) {
          size -= 1;
          el.style.fontSize = size + 'px';
        }
      } 
      // For catchphrase, we split into two lines if it's too long
      else if (id === 'catchphrase') {
        let txt = el.textContent.trim();
        // If catching phrase is empty, provide a default for ONMP case
        if (txt === "" || txt === "{CATCHPHRASE}") {
           txt = "平均点をたたき出すプロフェッショナル";
           el.textContent = txt;
        }

        if (txt.length > 18) {
          // Try to find a good split point
          const splitPoints = ['の', 'は', 'で', '！', '」', 'な'];
          let splitIdx = -1;
          const mid = Math.floor(txt.length / 2);
          
          for (let p of splitPoints) {
            let idx = txt.indexOf(p, mid - 3);
            if (idx !== -1 && idx < mid + 5) {
              splitIdx = idx + 1;
              break;
            }
          }
          
          if (splitIdx === -1) splitIdx = mid;
          el.innerHTML = txt.slice(0, splitIdx) + '<br>' + txt.slice(splitIdx);
          el.style.lineHeight = '1.2';
        }
      }
    }

    // Run adjustments
    window.onload = () => {
      // Catchphrase adjustment
      adjustFontSize('catchphrase', 580, 34, 24);
      // Type name adjustment (target 72px, min 40px)
      adjustFontSize('typename', 580, 72, 36);
    };
  </script>
</body>
</html>
