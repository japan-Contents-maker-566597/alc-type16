    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">

</head>
<body>
    <nav class="global-header">
        <a href="index.html" class="header-logo"><span style="font-size:1.2rem;">🏫</span> 大学生タイプ診断</a>
        <div class="header-nav">
            <a href="diagnosis.html">診断を受ける</a>
            <a href="list.html">16タイプ一覧</a>
            <a href="../alctype16/index.html">🍺 酒タイプ診断</a>
        </div>
        <button class="menu-toggle" aria-label="Menu" onclick="document.getElementById('mobileMenu').classList.toggle('active')">☰</button>
    </nav>
    <div class="mobile-menu" id="mobileMenu" style="position:fixed;">
        <a href="diagnosis.html">診断を受ける</a>
        <a href="list.html">16タイプ一覧</a>
        <a href="../alctype16/index.html">🍺 酒タイプ診断はこちら</a>
    </div>

    <div class="progress-container fade-in" id="progressContainer" style="display:none;">
        <div class="container" style="padding: 0 20px;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 15 回答完了</div>
        </div>
    </div>

    <div class="container fade-in" style="padding-top: 10px;">
        <!-- Step 0: User Info -->
        <div id="introSection" class="glass-card fade-in" style="margin-top:20px;">
            <h2 style="font-size: 1.4rem; color: var(--primary); margin-bottom: 20px;">診断をはじめる前に</h2>
            <div style="margin-bottom: 25px;">
                <p class="select-input-label">ニックネームを入力してください</p>
                <input type="text" id="userName" class="name-input" placeholder="例：キャンパス太郎" maxlength="15">
            </div>
            <div style="margin-bottom: 25px;">
                <span class="select-input-label">現在の状況</span>
                <select id="userMode" class="select-input">
                    <option value="student" selected>大学生</option>
                    <option value="alumni">社会人</option>
                </select>
            </div>
            <div style="margin-bottom: 30px;">
                <span class="select-input-label">性別</span>
                <select id="userGender" class="select-input">
                    <option value="回答しない" selected>回答しない</option>
                    <option value="男性">男性</option>
                    <option value="女性">女性</option>
                </select>
            </div>
            
            <!-- Ad unit in intro -->
            <div class="ads-box">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3644642136582562"
                     data-ad-slot="1628377322"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <button id="startBtn" class="btn btn-primary" style="padding: 20px; font-size: 1.2rem;">診断スタート！ 🚀</button>
        </div>

        <div id="questionsContainer" style="overflow-x: hidden; display:none;"></div>
        
        <button id="submitBtn" class="btn btn-primary" style="display:none; padding: 20px; font-size: 1.2rem; margin-top: 20px;">診断結果を見る✨</button>
    </div>

    <script src="js/logic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('questionsContainer');
            const introSection = document.getElementById('introSection');
            const progressContainer = document.getElementById('progressContainer');
            const startBtn = document.getElementById('startBtn');
            const userNameInput = document.getElementById('userName');
            const userGenderInput = document.getElementById('userGender');
            const submitBtn = document.getElementById('submitBtn');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            let answered = new Set();
            let currentIndex = 0;

            startBtn.addEventListener('click', () => {
                const name = userNameInput.value.trim() || 'ゲスト';
                const mode = document.getElementById('userMode').value;
                localStorage.setItem('college_user_name', name);
                localStorage.setItem('college_user_gender', userGenderInput.value);
                localStorage.setItem('college_diagnosis_mode', mode);
                
                // Set the question texts based on mode
                if (typeof setDiagnosisQuestions === 'function') {
                    setDiagnosisQuestions(mode);
                }
                
                render(); // Re-render to pick up new question texts
                
                introSection.style.display = 'none';
                container.style.display = 'block';
                progressContainer.style.display = 'block';
                window.scrollTo({top: 0, behavior: 'smooth'});
            });

            // Pre-select mode if available
            const savedMode = localStorage.getItem('college_diagnosis_mode') || 'student';
            document.getElementById('userMode').value = savedMode;

            function render() {
                container.innerHTML = QUESTIONS.map((q, qIndex) => `
                    <div class="question-view ${qIndex === 0 ? 'active' : ''}" id="qcard-${qIndex}">
                        <div class="question-card">
                            <div style="color:var(--primary); font-weight:bold; margin-bottom:5px;">Q${q.id} / 15</div>
                            <h3 class="question-title">${q.text}</h3>
                            <div>
                                ${q.choices.map((c, cIndex) => `
                                    <button type="button" class="option-btn" onclick="selectChoice(${qIndex}, ${cIndex}, this)">
                                        ${c.text}
                                    </button>
                                `).join('')}
                            </div>
                            ${qIndex > 0 ? `<button class="btn btn-secondary" style="margin-top:20px; font-size:0.95rem; padding:10px; background:#f1f5f9; color:#64748b; border:none;" onclick="goBack(${qIndex - 1})">← ひとつ前の質問に戻る</button>` : ''}
                        </div>
                    </div>
                `).join('');
            }

            window.goBack = function(prevIndex) {
                const currentView = document.querySelector('.question-view.active');
                if (currentView) currentView.classList.remove('active');
                
                const prevView = document.getElementById(`qcard-${prevIndex}`);
                if (prevView) {
                    prevView.style.animation = 'none'; // reset animation for going back
                    prevView.classList.add('active');
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }
            };

            window.selectChoice = function(qIndex, choiceIndex, btnElem) {
                // Record answer (we only care that it is answered, choice is selected)
                const view = document.getElementById(`qcard-${qIndex}`);
                view.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btnElem.classList.add('selected');

                if (!answered.has(qIndex)) {
                    answered.add(qIndex);
                    
                    const perc = (answered.size / QUESTIONS.length) * 100;
                    progressBar.style.width = perc + '%';
                    progressText.textContent = `${answered.size} / 15 回答完了`;
                }

                // Slide next
                setTimeout(() => {
                    const currentView = document.getElementById(`qcard-${qIndex}`);
                    const nextView = document.getElementById(`qcard-${qIndex + 1}`);
                    
                    if (nextView) {
                        currentView.classList.remove('active');
                        nextView.classList.add('active');
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    } else if (answered.size === QUESTIONS.length) {
                        submitBtn.style.display = 'block';
                        window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
                    }
                }, 300); // Wait 300ms so user can see selection
            };

            submitBtn.addEventListener('click', async () => {
                submitBtn.innerHTML = '🎯 診断中...';
                submitBtn.style.opacity = '1';
                
                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGq72C-ukIViED8rTiRYx7jMrp4PXapxOdBn5h6aU1OGbis4X5tBJvqM6rzDRerfE/exec";
                const nickname = localStorage.getItem('college_user_name') || 'ゲスト';
                const gender = localStorage.getItem('college_user_gender') || '回答しない';

                TYPES.forEach(t => state.scores[t] = 0);

                const views = document.querySelectorAll('.question-view');
                views.forEach((view, qIndex) => {
                    const selected = view.querySelector('.option-btn.selected');
                    if (selected) {
                        const btns = Array.from(view.querySelectorAll('.option-btn'));
                        const choiceIndex = btns.indexOf(selected);
                        handleAnswer(qIndex, choiceIndex);
                    }
                });

                const resultShortCode = getResult();
                
                // --- Logging & Analytics ---
                const payload = {
                    name: nickname,
                    gender,
                    result: resultShortCode,
                    sheetName: '大学生タイプ診断_ログ',
                    device: navigator.userAgent || ''
                };

                // 1. GA4 Event
                if (typeof gtag === 'function') {
                    gtag('event', 'diagnosis_complete', {
                        'event_category': 'engagement',
                        'event_label': 'college_diagnosis',
                        'result_type': resultShortCode,
                        'user_name': nickname
                    });
                }

                // 2. Google Sheets Logging
                try {
                    if (SCRIPT_URL && SCRIPT_URL.startsWith('http')) {
                        fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        }).catch(() => {});
                    }
                } catch (err) { console.error(err); }

                setTimeout(() => {
                    window.location.href = './types/' + resultShortCode + '.html';
                }, 800);
            });

            render();
        });
    </script>
</body>
</html>
